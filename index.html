    try{
      const user = await liveLogin(email, pass);
      if (user.mustReset){ showPasswordReset(user); return; }
      await liveLoadAll();
      enterApp(user);
    }catch(err){ loginError(err.message||'Login failed'); }
  };

  window.submitPasswordReset = async function(){
    const p1=document.getElementById('newPass').value||'';
    const p2=document.getElementById('newPass2').value||'';
    const e=document.getElementById('resetErr');
    const probs=passwordProblems(p1);
    if(probs.length){ e.innerHTML='Password must contain: '+probs.join(', ')+'.'; e.style.display='block'; return; }
    if(p1!==p2){ e.textContent='Passwords do not match.'; e.style.display='block'; return; }
    try{
      await liveSetPassword(p1);
      document.getElementById('resetView').style.display='none';
      document.getElementById('loginView').style.display='block';
      await liveLoadAll();
      enterApp(CURRENT);
    }catch(err){ e.textContent=err.message||'Could not set password'; e.style.display='block'; }
  };

  window.logout = async function(){
    try{ await liveLogout(); }catch(e){}
    CURRENT=null;
    document.getElementById('app').classList.remove('show');
    document.getElementById('login').style.display='flex';
    document.getElementById('loginView').style.display='block';
    document.getElementById('resetView').style.display='none';
    const le=document.getElementById('loginErr'); if(le) le.style.display='none';
  };

  // ---------- BRANDS ----------
  window.addBrand = async function(){
    const n=(document.getElementById('b_name').value||'').trim();
    if(!n){toast('Enter a brand name');return;}
    if(BRANDS.includes(n)){toast('That brand exists');return;}
    try{ await liveAddBrand(n); toast('Brand created · '+n); RENDER.brands(); }
    catch(e){ toast(e.message||'Could not create brand'); }
  };
  // UPDATED (Issue 2): cascade delete linked products (DB removes their records), then the brand
  window.removeBrand = async function(b){
    try{
      const skus=PRODUCTS.filter(p=>p.brand===b).map(p=>PROD_ID[p.sku]).filter(Boolean);
      if(skus.length){ await sb.from('products').delete().in('id', skus); }
      await liveRemoveBrand(b);
      touchUpdated();
      toast('Brand and its products removed'); RENDER.brands();
    }catch(e){ toast(e.message||'Could not delete brand'); }
  };

  // ---------- WAREHOUSES ----------
  window.addWarehouse = async function(){
    const n=(document.getElementById('w_name').value||'').trim();
    if(!n){toast('Enter a warehouse name');return;}
    if(WAREHOUSES.includes(n)){toast('That warehouse exists');return;}
    try{ await liveAddWarehouse(n); buildWhFilter(); toast('Warehouse created · '+n); RENDER.warehouses(); }
    catch(e){ toast(e.message||'Could not create warehouse'); }
  };
  window.removeWarehouse = async function(w){
    try{ await liveRemoveWarehouse(w); buildWhFilter(); toast('Warehouse removed'); RENDER.warehouses(); }
    catch(e){ toast('That warehouse still holds stock'); }
  };

  // ---------- PRODUCTS ----------
  window.saveProduct = async function(){
    const sku=(document.getElementById('p_sku').value||'').trim();
    const name=(document.getElementById('p_name').value||'').trim();
    const brand=document.getElementById('p_brand').value;
    if(!sku||!name){ toast('Enter SKU code and product name'); return; }
    if(!brand){ toast('Create a brand first'); return; }
    if(PRODUCTS.some(p=>p.sku===sku)){ toast('That SKU already exists'); return; }
    try{
      await liveAddProduct({ sku, name, brand,
        cost:parseInt(document.getElementById('p_cost').value)||0,
        price:parseInt(document.getElementById('p_price').value)||0,
        reorder:parseInt(document.getElementById('p_reorder').value)||0,
        max:parseInt(document.getElementById('p_max').value)||0 });
      toast('Product added · '+sku); RENDER.inward();
    }catch(e){ toast(e.message||'Could not add product'); }
  };

  // ---------- INWARD ----------
  window.saveInward = async function(){
    const type=(document.getElementById('in_type')||{}).value||'';
    const boe=(document.getElementById('in_boe').value||'').trim();
    const po=(document.getElementById('in_po').value||'').trim();
    const sku=document.getElementById('in_sku').value||'';
    const supplier=(document.getElementById('in_supplier').value||'').trim();
    const brand=(document.getElementById('in_brand').value||'').trim();
    const qty=parseInt(document.getElementById('in_qty').value)||0;
    const wh=document.getElementById('in_wh').value||'';
    const date=document.getElementById('in_date').value||'';
    const missing=[];
    if(!type) missing.push('Entry Type');
    if(!boe) missing.push('BOE');
    if(!po) missing.push('PO');
    if(!sku) missing.push('Product / SKU');
    if(!supplier) missing.push('Supplier');
    if(!brand) missing.push('Brand');
    if(!qty) missing.push('Quantity');
    if(!wh) missing.push('Warehouse');
    if(!date) missing.push('Date');
    if(missing.length){ showFieldError('in_err','Please fill all required fields: '+missing.join(', ')); return; }
    clearFieldError('in_err');
    const p=prod(sku);
    const unitCost=p.cost||0;
    const val=parseInt(document.getElementById('in_value').value)||qty*unitCost;
    const grn=(document.getElementById('in_grn').value||'').trim();
    try{
      await liveAddInward({ type, boe, po, supplier, brand, sku, qty, unitCost, value:val, wh, date, grn });
      toast(`${type} saved · +${qty} ${sku} to ${wh}`); RENDER.inward();
    }catch(e){ toast(e.message||'Could not save intake'); }
  };
  window.deleteInward = async function(id){
    try{ await liveDeleteInward(id); toast('Inward deleted'); RENDER.inward(); }
    catch(e){ toast(e.message||'Could not delete'); }
  };

  // ---------- OUTWARD ----------
  window.saveOutward = async function(){
    const sku=document.getElementById('ou_sku').value; if(!sku){ toast('Add a product first'); return; }
    const p=prod(sku);
    const qty=parseInt(document.getElementById('ou_qty').value)||0;
    const price=parseInt(document.getElementById('ou_price').value)||p.price||0;
    const channel=document.getElementById('ou_channel').value;
    const wh=document.getElementById('ou_wh').value;
    const order=document.getElementById('ou_order').value.trim()||((channel==='Amazon'?'403-':'ORD-')+Math.floor(Math.random()*9000000+1000000));
    const commission=Math.round(parseFloat(document.getElementById('ou_comm').value)||0);
    if(!qty){ toast('Enter a quantity'); return; }
    if(stockQty(sku,wh)<qty){ toast(`Not enough stock: ${stockQty(sku,wh)} of ${sku} in ${wh}`); return; }
    const date=new Date().toISOString().slice(0,10);
    try{
      await liveAddOutward({ order, channel, sku, qty, price, commission, wh, date });
      toast(`Sale logged · -${qty} ${sku} from ${wh}`); renderSalesTab();
    }catch(e){ toast(e.message||'Could not log sale'); }
  };
  window.deleteOutward = async function(id){
    try{ await liveDeleteOutward(id); toast('Sale deleted'); renderSalesTab(); }
    catch(e){ toast(e.message||'Could not delete'); }
  };

  // ---------- TRANSFERS ----------
  window.saveTransfer = async function(){
    const sku=document.getElementById('tr_sku').value;
    const qty=parseInt(document.getElementById('tr_qty').value)||0;
    const from=document.getElementById('tr_from').value, to=document.getElementById('tr_to').value;
    const date=document.getElementById('tr_date').value||new Date().toISOString().slice(0,10);
    if(!qty){ toast('Enter a quantity'); return; }
    if(from===to){ toast('Choose different warehouses'); return; }
    if(stockQty(sku,from)<qty){ toast(`Not enough stock: ${stockQty(sku,from)} in ${from}`); return; }
    try{
      await liveAddTransfer({ sku, qty, from, to, date });
      toast(`Transferred ${qty} ${sku}: ${from} → ${to}`); renderTransferTab();
    }catch(e){ toast(e.message||'Could not transfer'); }
  };

  // ---------- USERS ----------
  window.createUser = async function(){
    const name=(document.getElementById('u_name').value||'').trim();
    const email=(document.getElementById('u_email').value||'').trim();
    const pass=(document.getElementById('u_pass').value||'').trim();
    const brands=Array.from(document.querySelectorAll('.u_brand_cb')).filter(c=>c.checked).map(c=>c.value);
    if(!name||!email||!pass){ showFieldError('u_err','Fill name, email and temporary password'); return; }
    if(!isValidEmail(email)){ showFieldError('u_err','Please enter a valid email address (e.g. name@company.com)'); return; }
    if(!brands.length){ showFieldError('u_err','Select at least one brand'); return; }
    clearFieldError('u_err');
    try{
      await liveCreateUser({ name, email, pass, brands });
      toast(`User created · ${name} → ${brands.join(', ')}`); RENDER.users();
    }catch(e){ showFieldError('u_err', e.message||'Could not create user'); }
  };
  window.toggleUser = async function(id){
    const u=USERS.find(x=>x.id===id); if(!u) return;
    try{ await liveSetUserActive(id, !u.active); toast(!u.active?'User enabled':'User disabled'); RENDER.users(); }
    catch(e){ toast(e.message||'Could not update user'); }
  };
  // deleting an auth user needs admin API; disable in-browser delete when live
  window.deleteUser = function(){ toast('Disable the user instead, or remove them in Supabase → Authentication'); };

  // ---------- TRANSFER delete (Issue 5, live) ----------
  window.deleteTransfer = async function(id){
    try{ await liveDeleteTransfer(id); touchUpdated(); toast('Transfer deleted'); renderTransferTab(); }
    catch(e){ toast(e.message||'Could not delete transfer'); }
  };

  // ---------- PRODUCT edit/delete (Issue 2, live) ----------
  window.deleteProduct = async function(sku){
    try{ await liveDeleteProduct(sku); touchUpdated(); toast('Product deleted · '+sku); if(typeof closeModal==='function')closeModal(); RENDER.brands(); }
    catch(e){ toast(e.message||'Could not delete product'); }
  };

  // touchUpdated after live create/delete of records (Issue 3)
  const _wrap=(fnName)=>{ const orig=window[fnName]; if(typeof orig==='function'){ window[fnName]=async function(){ const r=await orig.apply(this,arguments); try{touchUpdated();}catch(e){} return r; }; } };
  ['deleteInward','deleteOutward','saveInward','saveOutward','saveTransfer','createUser'].forEach(_wrap);

  // ---------- CSV IMPORTS: reload from DB after import ----------
  const _hi = window.handleInwardUpload;
  // (imports already call RENDER.inward(); with live writes they persist per row via saveInward path)

  // ADDED (Issue 1): auto-login on refresh if a valid session exists.
  async function _bootSession(){
    try{
      const user = await liveRestoreSession();
      if(!user) return;                     // no session → stay on login page
      if(user.mustReset){ showPasswordReset(user); return; }
      await liveLoadAll();
      enterApp(user);
    }catch(e){ /* stay on login on any error */ }
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', _bootSession); }
  else { _bootSession(); }
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTOEN CLIENTS ACCESS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --orange:rgba(246,134,22,1);
  --orange-soft:rgba(246,134,22,.12);
  --orange-mid:rgba(246,134,22,.5);
  --teal:rgba(53,140,157,1);
  --teal-soft:rgba(53,140,157,.12);
  --teal-mid:rgba(53,140,157,.5);
  --ink:#12242a;
  --ink-soft:#5b6f76;
  --line:#e3e9ea;
  --bg:#f5f7f8;
  --card:#ffffff;
  --good:#1f9d6b;
  --bad:#d6453d;
  --warn:#e0932f;
  --radius:14px;
  --shadow:0 1px 3px rgba(18,36,42,.06),0 8px 24px rgba(18,36,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-weight:650;letter-spacing:-.02em;line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============ LOGIN ============ */
#login{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 600px at 15% -10%,var(--teal-soft),transparent 60%),
    radial-gradient(1000px 500px at 110% 120%,var(--orange-soft),transparent 55%),
    #0e2026;
  padding:24px;
}
.login-card{
  width:100%;max-width:420px;background:var(--card);border-radius:20px;
  padding:40px 36px;box-shadow:0 30px 80px rgba(0,0,0,.4);
}
.brandmark{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.brand-logo{height:56px;width:auto;display:block;object-fit:contain}
.sidebar-logo{height:52px;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.brandmark .dot{
  width:38px;height:38px;border-radius:11px;position:relative;flex-shrink:0;
  background:linear-gradient(135deg,var(--orange),var(--teal));
}
.brandmark .dot::after{
  content:"";position:absolute;inset:11px 11px auto auto;width:9px;height:9px;
  border-radius:50%;background:#fff;top:11px;right:11px;
}
.brandmark b{font-size:19px;letter-spacing:-.03em}
.brandmark span{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:.02em}
.login-card h2{font-size:22px;margin-bottom:6px}
.login-card p.sub{color:var(--ink-soft);margin-bottom:26px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  transition:border-color .15s,box-shadow .15s;background:#fbfcfc;
}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);background:#fff}
.role-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.role-toggle button{
  padding:11px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13px;
  color:var(--ink-soft);background:#fbfcfc;transition:.15s;
}
.role-toggle button.active{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.role-toggle button .r-sub{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.btn-primary{
  width:100%;padding:13px;border-radius:10px;font-weight:650;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--orange),#e07615);transition:.15s;
}
.btn-primary:hover{filter:brightness(1.05);box-shadow:0 8px 20px var(--orange-mid)}
.login-hint{margin-top:18px;padding:12px;background:var(--teal-soft);border-radius:10px;font-size:12px;color:var(--teal)}
.login-hint b{color:var(--teal)}

/* ============ APP SHELL ============ */
#app{display:none}
#app.show{display:block}
.sidebar{
  background:#0e2026;color:#c7d5d8;padding:20px 14px;display:flex;flex-direction:column;
  position:fixed;left:0;top:0;bottom:0;width:260px;overflow-y:auto;z-index:40;
}
.sidebar .brandmark{margin-bottom:26px;padding:0 8px}
.sidebar .brandmark b{color:#fff;font-size:17px}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6a8189;padding:14px 12px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  color:#c7d5d8;font-weight:550;font-size:13.5px;transition:.13s;width:100%;text-align:left;margin-bottom:1px;
}
.nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--orange),#e07615);color:#fff;box-shadow:0 6px 16px rgba(246,134,22,.3)}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;stroke-width:2}
.nav-item .badge{margin-left:auto;flex-shrink:0;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.user-chip .av{width:32px;height:32px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.user-chip>div{min-width:0}
.user-chip .un{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .ur{font-size:11px;color:#8aa0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout{margin-left:auto;color:#8aa0a6;padding:6px;flex-shrink:0}
.logout:hover{color:#fff}

/* Main content sits to the RIGHT of the fixed sidebar */
.main{margin-left:260px;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:20px}
.topbar .crumb{color:var(--ink-soft);font-size:12.5px;font-weight:500}
.topbar .spacer{flex:1}
.last-updated{font-size:12px;color:var(--ink-soft);font-weight:500;white-space:nowrap;margin-right:6px}
@media(max-width:760px){.last-updated{display:none}}
.mobile-menu{display:none}
.chip-filter{
  display:flex;align-items:center;gap:7px;padding:8px 12px;border:1.5px solid var(--line);
  border-radius:9px;background:#fbfcfc;font-size:13px;font-weight:550;color:var(--ink);
}
.chip-filter select{border:none;background:none;font-weight:600;color:var(--ink);outline:none;cursor:pointer}
.sync-pill{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:20px;background:var(--good);color:#fff;font-size:12px;font-weight:600}
.sync-pill .live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.content{padding:24px 28px 48px;flex:1}
.page{display:none;animation:fade .3s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.kpi.orange::before{background:var(--orange)}
.kpi .k-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:27px;font-weight:700;letter-spacing:-.03em}
.kpi .k-delta{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.k-delta.up{color:var(--good)}.k-delta.down{color:var(--bad)}
.kpi .k-ic{position:absolute;right:16px;top:16px;opacity:.13;width:40px;height:40px}

/* Cards / grid */
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:20px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card-head{display:flex;align-items:center;margin-bottom:16px;gap:12px}
.card-head h3{font-size:15px}
.card-head .ch-sub{font-size:12px;color:var(--ink-soft);font-weight:500}
.card-head .spacer{flex:1}
.mini-tab{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.mini-tab button{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.mini-tab button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-wrap{position:relative;height:260px}
.chart-wrap.tall{height:300px}

/* Table */
.table-tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-box{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfc;flex:1;min-width:200px}
.search-box input{border:none;background:none;outline:none;width:100%}
.btn{padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{filter:brightness(1.07);box-shadow:0 6px 16px var(--teal-mid)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{filter:brightness(1.05);box-shadow:0 6px 16px var(--orange-mid)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
  font-weight:700;padding:10px 14px;border-bottom:2px solid var(--line);white-space:nowrap;
}
thead th.num,tbody td.num{text-align:right}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
tbody tr:hover{background:var(--teal-soft)}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650}
.tag.amazon{background:#fff3e6;color:#d97a06}
.tag.offline{background:var(--teal-soft);color:var(--teal)}
.tag.shopify{background:#e7f4ec;color:#1f9d6b}
.tag.flipkart{background:#eaf0fb;color:#3a6bd6}
.stock-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:8px}
.stock-bar i{display:block;height:100%;border-radius:6px}
.sku-cell{font-weight:600}
.sku-cell small{display:block;color:var(--ink-soft);font-weight:500;font-size:11.5px}
.pill{padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:650}
.pill.ok{background:#e7f4ec;color:var(--good)}
.pill.low{background:#fdeceb;color:var(--bad)}
.pill.over{background:#fdf3e3;color:var(--warn)}
.pos{color:var(--good);font-weight:650}
.neg{color:var(--bad);font-weight:650}

/* Alerts */
.alert-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
.alert-row .a-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.a-ic.low{background:#fdeceb;color:var(--bad)}
.a-ic.over{background:#fdf3e3;color:var(--warn)}
.a-ic.drop{background:var(--teal-soft);color:var(--teal)}
.alert-row .a-body{flex:1}
.alert-row .a-title{font-weight:650;font-size:13.5px}
.alert-row .a-desc{font-size:12.5px;color:var(--ink-soft)}
.alert-row .a-time{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}

/* Upload / drop */
.drop-zone{
  border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;
  background:#fbfcfc;transition:.15s;cursor:pointer;display:block;
}
.drop-zone:hover{border-color:var(--teal);background:var(--teal-soft)}
.drop-zone .dz-ic{width:38px;height:38px;color:var(--teal);margin:0 auto 10px;display:block}
.drop-zone h4{font-size:14px;margin-bottom:4px}
.drop-zone p{font-size:12.5px;color:var(--ink-soft)}
.drop-zone .link{color:var(--orange);font-weight:650}
.upload-sep{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.upload-sep::before,.upload-sep::after{content:"";flex:1;height:1px;background:var(--line)}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.form-grid .fg-field{display:flex;flex-direction:column;gap:6px}
.form-grid label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.form-grid input,.form-grid select{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfc}
.form-grid input:focus,.form-grid select:focus{outline:none;border-color:var(--teal);background:#fff}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin:4px 0 14px}

/* Integration cards */
.integ-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.integ-card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card)}
.integ-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.integ-logo{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.integ-card .status-line{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot-idle{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.integ-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.integ-meta .im{background:var(--bg);border-radius:8px;padding:9px 11px}
.integ-meta .im .l{font-size:11px;color:var(--ink-soft);font-weight:600}
.integ-meta .im .v{font-size:14px;font-weight:700;margin-top:2px}

.two-col-note{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.note-card{background:var(--teal-soft);border-radius:12px;padding:18px 20px}
.note-card h4{color:var(--teal);font-size:13px;margin-bottom:8px;display:flex;gap:7px;align-items:center}
.note-card ul{list-style:none;font-size:12.5px;color:var(--ink)}
.note-card li{padding:4px 0 4px 18px;position:relative}
.note-card li::before{content:"→";position:absolute;left:0;color:var(--teal);font-weight:700}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:14px 20px;
  border-radius:12px;font-size:13.5px;font-weight:550;box-shadow:0 12px 32px rgba(0,0,0,.25);
  z-index:200;display:flex;align-items:center;gap:10px;transform:translateY(120px);opacity:0;
  transition:.35s cubic-bezier(.2,.8,.2,1);max-width:340px;
}
.toast.show{transform:none;opacity:1}
.toast .t-ic{color:var(--orange)}

/* responsive */
@media(max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-2b,.integ-grid,.two-col-note{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  /* Sidebar becomes an off-canvas drawer; content spans full width */
  .main{margin-left:0}
  .sidebar{transform:translateX(-100%);transition:.25s;box-shadow:0 0 60px rgba(0,0,0,.4);z-index:60}
  .sidebar.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .scrim.show{display:block}
  .mobile-menu{display:inline-flex}
  .topbar{padding:14px 16px}
  .content{padding:16px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k-val{font-size:22px}
  .form-grid{grid-template-columns:1fr}
  .topbar h1{font-size:17px}
  .hide-sm{display:none}
  table{font-size:12.5px}
  .content{overflow-x:auto}
}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
/* ADDED (Point 4/5): reusable list filter + export toolbar */
.list-toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.list-toolbar .spacer{flex:1}
.lf-search{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;min-width:200px}
.lf-search svg{color:var(--ink-soft);flex-shrink:0}
.lf-search input{border:none;background:none;outline:none;font-size:13px;width:100%;color:var(--ink)}
.lf-field{display:flex;flex-direction:column;gap:3px}
.lf-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.lf-field select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--card);min-width:130px}
@media(max-width:640px){.lf-search{min-width:100%}.list-toolbar .spacer{display:none}}
/* FIX (Priority 4): product catalog table — consistent columns, sticky header, smooth scroll */
.pm-scroll{max-height:60vh;overflow-y:auto}
.pm-table{width:100%;border-collapse:collapse;table-layout:auto;min-width:640px}
.pm-table thead th{position:sticky;top:0;z-index:2;background:var(--card);box-shadow:0 1px 0 var(--line)}
.pm-table th,.pm-table td{white-space:nowrap;text-align:left;padding:9px 12px;vertical-align:middle}
.pm-table th.num,.pm-table td.num{text-align:right}
.pm-table th:nth-child(1),.pm-table td:nth-child(1){min-width:120px}
.pm-table th:nth-child(2),.pm-table td:nth-child(2){min-width:200px;white-space:normal}
.pm-table th:nth-child(3),.pm-table td:nth-child(3){min-width:120px}
.pm-table th:nth-child(4),.pm-table td:nth-child(4){min-width:120px}
.pm-table th:nth-child(7),.pm-table td:nth-child(7){min-width:150px;text-align:right}
.pm-table tbody tr:hover{background:var(--bg)}
/* multi-line intake table */
.line-table{width:100%;border-collapse:collapse;min-width:640px}
.line-table th,.line-table td{padding:6px 8px;vertical-align:middle}
.line-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:left}
.line-table th.num,.line-table td.num{text-align:right}
.line-table select,.line-table input{width:100%;box-sizing:border-box}
@media(max-width:760px){.pm-table,.line-table{min-width:560px}}
/* BOE grouped inward (client view) */
.boe-card{margin-bottom:18px;padding:0;overflow:hidden}
.boe-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(53,140,157,.10),rgba(246,134,22,.08));padding:18px 22px;border-bottom:1px solid var(--line)}
.boe-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700}
.boe-no{font-size:20px;font-weight:750;letter-spacing:-.02em}
.boe-meta{display:flex;gap:22px;flex-wrap:wrap}
.boe-meta>div{display:flex;flex-direction:column}
.boe-meta span{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.boe-meta b{font-size:15px;font-weight:700;margin-top:2px}
.po-block{padding:14px 22px 4px}
.po-block+.po-block{border-top:1px dashed var(--line)}
.po-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.po-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);font-weight:700}
.po-head b{font-size:14px}
.po-date{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.po-table thead th{font-size:10px}
.po-table{margin-bottom:12px}
.brand-check-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.brand-check{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfc;font-size:13px;font-weight:550;cursor:pointer;transition:.13s}
.brand-check:hover{border-color:var(--teal)}
.brand-check input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.sales-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fbfcfc;font-size:13px}
.filter-input:focus{outline:none;border-color:var(--teal);background:#fff}
.filter-range{display:flex;align-items:center;gap:8px}
.rng-to{color:var(--ink-soft);font-size:12.5px}
/* import error banner */
.import-error{background:#fdeceb;border:1.5px solid #f5c3bf;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.ie-head{display:flex;align-items:center;gap:10px;color:#c0392b;font-size:13.5px}
.ie-head b{flex:1;font-weight:650}
.ie-close{margin-left:auto;color:#c0392b;font-size:14px;padding:2px 6px;font-weight:700;background:none}
.ie-list{margin:10px 0 2px;padding-left:8px;list-style:none;max-height:220px;overflow:auto}
.ie-list li{font-size:12.5px;color:#8a2c22;padding:3px 0 3px 16px;position:relative}
.ie-list li::before{content:"•";position:absolute;left:2px;color:#c0392b}
/* BOE expand/collapse */
.boe-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.boe-toggle{cursor:pointer;user-select:none}
.boe-toggle:hover{background:linear-gradient(135deg,rgba(53,140,157,.14),rgba(246,134,22,.10))}
.boe-chev{transition:transform .18s;color:var(--teal);flex-shrink:0}
.boe-chev.open{transform:rotate(90deg)}
/* warehouse-grouped outward */
.wh-group{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.wh-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(246,134,22,.10),rgba(53,140,157,.08));padding:14px 20px;border-bottom:1px solid var(--line)}
.wh-name{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--ink)}
.wh-name svg{color:var(--teal)}
.wh-meta{display:flex;align-items:center;gap:18px;font-size:12.5px;color:var(--ink-soft)}
.wh-meta b{font-size:15px;color:var(--ink)}
.wh-table{margin:0}
.wh-table thead th{font-size:10px}
.btn-del{padding:5px 11px;color:var(--bad);border-color:transparent}
.btn-del:hover{border-color:var(--bad);background:#fdeceb;color:var(--bad)}
/* ADDED: validation + modal styles (feature patch) */
.req{color:var(--bad);font-weight:700}
.field-error{background:#fdeceb;color:#c0392b;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:12px;border:1px solid #f5c3bf}
.modal-scrim{position:fixed;inset:0;background:rgba(18,36,42,.48);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-card{background:var(--card);border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;animation:modalIn .16s ease}
.modal-card.modal-sm{max-width:400px}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;color:var(--ink)}
.modal-x{background:none;border:none;font-size:15px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;border-radius:7px}
.modal-x:hover{background:var(--bg);color:var(--ink)}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal-body .field-error{margin:0}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg)}
#modalErr{margin:14px 20px 0}
.btn-del-solid{background:var(--bad);color:#fff;border:1px solid var(--bad);padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer}
.btn-del-solid:hover{filter:brightness(.94)}
/* ADDED (Issue 6): upload preview */
.upload-preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;max-height:180px;overflow:auto}
.upload-preview .up-title{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.upload-preview .up-row{font-size:12.5px;color:var(--ink);font-family:ui-monospace,monospace;padding:2px 0;border-bottom:1px dashed var(--line)}
.upload-preview .up-more{font-size:12px;color:var(--ink-soft);padding-top:6px}

</style>

    <div id="loginView">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your operations dashboard</p>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <div id="loginErr" style="display:none;background:#fdeceb;color:#d6453d;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:14px"></div>
      <button class="btn-primary" data-onclick="doLogin()">Sign in →</button>
    </div>

    <div id="resetView" style="display:none">
      <h2>Set your password</h2>
      <p class="sub">First login — please choose a new password to continue.</p>
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPass" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special">
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" id="newPass2" placeholder="Re-enter password">
      </div>
      <div id="resetErr" style="display:none;background:#fdeceb;color:#d6453d;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;margin-bottom:14px"></div>
      <button class="btn-primary" data-onclick="submitPasswordReset()">Set password & continue →</button>
    </div>
  </div>
</div>

<script>
const RENDER = {};
/* ============================================================
   ENTOEN — Inventory & Sales Command Center
   Admin builds everything from scratch: brands, warehouses, users.
   Then pushes inward (purchase/return, against BOE + PO) and
   outward (sales) data. Everything is in-session (front-end
   prototype); the build guide covers the persistent backend.
============================================================ */

let CURRENT = null;               // logged-in user
let ROLE = 'admin';
let WH_FILTER = 'all';            // top-right warehouse filter
let AMAZON_COMMISSION = 0.30;
/* Per-order commission: use the AED amount recorded with the order (from the sales
   template's Commission column). Manual entries without an amount fall back to 0. */
function orderCommission(o){ return (o && typeof o.commission==='number') ? o.commission : 0; }

/* ---------- DATA STORES (start blank) ---------- */
const BRANDS = [];                // ['Brand A', ...]
const WAREHOUSES = [];            // ['Mumbai WH-01', ...]
const USERS = [
  // one bootstrap admin so you can log in and build everything
  {id:'U-001', name:'Admin User', email:'admin@entoen.com', pass:'admin', role:'admin', brands:[], active:true, mustReset:false},
];
const PRODUCTS = [];              // {sku,name,brand,cost,price,reorder,max}
const STOCK = [];                 // {sku,wh,qty}  (current on-hand by sku+warehouse)
const INWARD = [];                // {type:'Purchase'|'Return', boe, po, supplier(brand), sku, qty, value, wh, date, grn}
const OUTWARD = [];               // {order, channel, sku, qty, price, date, wh, brand}
const TRANSFERS = [];             // {id, sku, qty, from, to, date, status}
// ADDED (Feature 5): editable sales channels
const CHANNELS = ['Amazon','Noon','Shopify','Flipkart','Offline'];

let _idSeq = 1;
function nextId(prefix){ return (prefix||'ID')+'-'+(_idSeq++).toString().padStart(5,'0'); }
function nextRef(prefix){ return (prefix||'REF')+'-'+Math.floor(Math.random()*9000000+1000000); }

/* ---------- HELPERS ---------- */
const inr = n => 'AED ' + Math.round(n||0).toLocaleString('en-AE');
const inrK = n => { n=n||0; return n>=1000000 ? 'AED '+(n/1000000).toFixed(2)+'M' : n>=1000 ? 'AED '+(n/1000).toFixed(1)+'K' : inr(n); };
const prod = sku => PRODUCTS.find(p=>p.sku===sku) || {};
const channelClass = c => ({Amazon:'amazon',Offline:'offline',Shopify:'shopify',Flipkart:'flipkart'}[c]||'offline');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function isAdmin(){ return CURRENT && CURRENT.role==='admin'; }
function myBrands(){ return CURRENT && CURRENT.brands ? CURRENT.brands : []; }
function myBrandLabel(){ const b=myBrands(); return b.length===0?'—':b.length===1?b[0]:b.length+' brands'; }
function inMyBrands(brand){ return myBrands().includes(brand); }
/* is this brand assigned to at least one client user? */
function brandHasUser(brand){ return USERS.some(u=>u.role==='brand' && (u.brands||[]).includes(brand)); }
/* auto-create a product under a brand if it doesn't exist (SKU is not validated on import) */
function ensureProduct(sku, name, brand){
  if(!sku) return null;
  let p=PRODUCTS.find(x=>x.sku===sku);
  if(!p){ p={sku, name:name||sku, brand:brand||'', cost:0, price:0, reorder:0, max:0}; PRODUCTS.push(p); }
  return p;
}

/* --- warehouse filter awareness --- */
function whMatch(wh){ return WH_FILTER==='all' || wh===WH_FILTER; }

/* --- scoped + filtered views --- */
function scopeProducts(){ return isAdmin() ? PRODUCTS : PRODUCTS.filter(p=>inMyBrands(p.brand)); }
function scopeStock(){
  const skus = new Set(scopeProducts().map(p=>p.sku));
  return STOCK.filter(s=>skus.has(s.sku) && whMatch(s.wh));
}
function scopeInward(){
  const skus = new Set(scopeProducts().map(p=>p.sku));
  return INWARD.filter(r=>(isAdmin()? true : skus.has(r.sku)) && whMatch(r.wh));
}
function scopeOutward(){
  const skus = new Set(scopeProducts().map(p=>p.sku));
  return OUTWARD.filter(o=>(isAdmin()? true : skus.has(o.sku)) && whMatch(o.wh));
}
function scopeTransfers(){
  const skus = new Set(scopeProducts().map(p=>p.sku));
  return TRANSFERS.filter(t=>(isAdmin()? true : skus.has(t.sku)) && (WH_FILTER==='all'||t.from===WH_FILTER||t.to===WH_FILTER));
}
function stockQty(sku,wh){ const r=STOCK.find(s=>s.sku===sku&&s.wh===wh); return r?r.qty:0; }
function addStock(sku,wh,delta){
  let r=STOCK.find(s=>s.sku===sku&&s.wh===wh);
  if(!r){ r={sku,wh,qty:0}; STOCK.push(r); }
  r.qty += delta;
}
// FIXED (Issue 4): rebuild STOCK live from ledgers so deletes never leave ghost stock.
// Stock = SUM(Inward) - SUM(Outward) ± Transfers, per SKU+Warehouse.
// Orphan (zero) entries are dropped and negative stock is clamped to 0.
function recomputeStock(){
  const map={}; // key sku@wh -> qty
  const key=(sku,wh)=>sku+'@@'+wh;
  const bump=(sku,wh,d)=>{ if(!sku||!wh)return; const k=key(sku,wh); map[k]=(map[k]||0)+d; };
  INWARD.forEach(r=>{ bump(r.sku, r.wh, r.qty); });               // inward adds (purchase + return)
  OUTWARD.forEach(o=>{ bump(o.sku, o.wh, -o.qty); });            // outward subtracts
  TRANSFERS.forEach(t=>{ bump(t.sku, t.from, -t.qty); bump(t.sku, t.to, t.qty); }); // move between warehouses
  STOCK.length=0; // clear old (removes orphan entries)
  Object.keys(map).forEach(k=>{
    const q=map[k]; if(q===0) return;                             // drop zero/orphan lines
    const [sku,wh]=k.split('@@');
    STOCK.push({ sku, wh, qty: q<0?0:q });                        // prevent negative stock
  });
}

/* ============================================================
   LOGIN + FIRST-LOGIN PASSWORD RESET
============================================================ */
function doLogin(){
  const email=(document.getElementById('email').value||'').trim().toLowerCase();
  const pass=document.getElementById('password').value||'';
  const user=USERS.find(u=>u.email.toLowerCase()===email);
  if(!user || user.pass!==pass){ loginError('Incorrect email or password.'); return; }
  if(!user.active){ loginError('This account is deactivated. Contact your admin.'); return; }
  if(user.mustReset){ showPasswordReset(user); return; }
  enterApp(user);
}
function loginError(msg){ const e=document.getElementById('loginErr'); if(e){ e.textContent=msg; e.style.display='block'; } }
function showPasswordReset(user){
  window._resetUser = user;
  document.getElementById('loginView').style.display='none';
  document.getElementById('resetView').style.display='block';
  document.getElementById('resetErr').style.display='none';
}
// UPDATED (Feature 6): strong password rules
function passwordProblems(p){
  const errs=[];
  if(p.length<8) errs.push('at least 8 characters');
  if(!/[A-Z]/.test(p)) errs.push('one uppercase letter');
  if(!/[0-9]/.test(p)) errs.push('one number');
  if(!/[^A-Za-z0-9]/.test(p)) errs.push('one special character');
  return errs;
}
function submitPasswordReset(){
  const p1=document.getElementById('newPass').value||'';
  const p2=document.getElementById('newPass2').value||'';
  const e=document.getElementById('resetErr');
  const probs=passwordProblems(p1);
  if(probs.length){ e.innerHTML='Password must contain: '+probs.join(', ')+'.'; e.style.display='block'; return; }
  if(p1!==p2){ e.textContent='Passwords do not match.'; e.style.display='block'; return; }
  e.style.display='none';
  const u=window._resetUser; u.pass=p1; u.mustReset=false;
  document.getElementById('resetView').style.display='none';
  document.getElementById('loginView').style.display='block';
  enterApp(u);
}
function enterApp(user){
  CURRENT=user; ROLE=user.role; WH_FILTER='all';
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('show');
  const initials=user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('userAv').textContent=initials;
  document.getElementById('userName').textContent=user.name;
  document.getElementById('userRole').textContent=isAdmin()?'Administrator':(myBrandLabel()+' · Client');
  buildWhFilter();
  buildNav();
  // ADDED (Issue 3): render stored last-updated on entry
  loadLastUpdated();
  const lu=document.getElementById('lastUpdated'); if(lu) lu.textContent='Last updated: '+fmtUpdated(LAST_UPDATED);
  go('dashboard');
}
function logout(){
  CURRENT=null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login').style.display='flex';
  document.getElementById('loginView').style.display='block';
  document.getElementById('resetView').style.display='none';
  const le=document.getElementById('loginErr'); if(le) le.style.display='none';
}

function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML = NAV.map(g=>{
    if(g.adminOnly && !isAdmin()) return '';
    const items=g.items.filter(it=>!(it.adminOnly && !isAdmin()));
    if(!items.length) return '';
    return `<div class="nav-group-label">${g.group}</div>`+items.map(it=>`
      <button class="nav-item" data-page="${it.id}" data-onclick="go('${it.id}')">
        <svg class="ic" fill="none" stroke="currentColor" viewBox="0 0 24 24">${ICONS[it.icon]}</svg>
        <span>${it.label}</span>
      </button>`).join('');
  }).join('');
}
function go(page){
  const adminPages=['brands','products','warehouses','users','channels'];
  if(adminPages.includes(page) && !isAdmin()) page='dashboard';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  (RENDER[page]||RENDER.dashboard)();

}

let LAST_UPDATED = null;
function touchUpdated(){

  try{ localStorage.setItem('entoen_last_updated', LAST_UPDATED); }catch(e){}
  const el=document.getElementById('lastUpdated');

function touchUpdatedSafe(){ try{ if(typeof touchUpdated==='function') touchUpdated(); }catch(e){} }
function fmtUpdated(iso){
  if(!iso) return '—';
  const d=new Date(iso); if(isNaN(d)) return '—';
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

const IMPORT_ERR = { inward:null, outward:null, transfer:null, product:null }; // UPDATED (Priority 2A): + product
function refreshImportSection(section){ // ADDED (Issue 5)

  else if(section==='transfer'){ if(typeof renderTransferTab==='function') renderTransferTab(); }

  </div>`;
}

/* CSV export */
function downloadCSV(filename, rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  toast('Downloaded '+filename);
}

function lineOpts(){return{maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true,padding:14}}},scales:{y:{grid:{color:'#eef2f3'},ticks:{callback:v=>'AED '+(v/1000)+'K'}},x:{grid:{display:false}}}};}

const hasData = () => PRODUCTS.length>0 || INWARD.length>0 || OUTWARD.length>0;

/* ---------- DASHBOARD ---------- */
RENDER.dashboard=function(){
  setHead('Dashboard', (isAdmin()?'All brands':myBrandLabel())+(WH_FILTER==='all'?'':' · '+WH_FILTER));
  const stock=scopeStock(), out=scopeOutward();
  const totalUnits=stock.reduce((s,r)=>s+r.qty,0);
  const stockValue=stock.reduce((s,r)=>s+r.qty*(prod(r.sku).cost||0),0);
  const revenue=out.reduce((s,o)=>s+o.qty*o.price,0);
  const cogs=out.reduce((s,o)=>s+o.qty*(prod(o.sku).cost||0),0);
  const commission=out.reduce((s,o)=>s+orderCommission(o),0);
  const profit=revenue-cogs-commission;

  if(!hasData()){
    C.innerHTML = `
      <div class="kpi-grid">
        ${kpi('Total Stock','0 <span style="font-size:14px;color:var(--ink-soft)">units</span>','','','box')}
        ${kpi('Sales Revenue','AED 0','','','trending',true)}
        ${kpi('Net Profit','AED 0','','','trending')}
        ${kpi('Commission','AED 0','','','trending',true)}
      </div>
      ${emptyState('grid','Your dashboard is empty','Start by creating a brand and a warehouse, add a user, then record inward stock and sales. KPIs and charts will populate automatically.', isAdmin()?'Create your first brand':'', "go('brands')")}`;
    return;
  }
  C.innerHTML=`
  <div class="kpi-grid">
    ${kpi('Total Stock', totalUnits.toLocaleString('en-AE')+' <span style="font-size:14px;color:var(--ink-soft)">units</span>', inrK(stockValue)+' value','','box')}
    ${kpi('Sales Revenue', inrK(revenue), out.length+' orders','up','trending',true)}
    ${kpi('Net Profit', inrK(profit), revenue?((profit/revenue)*100).toFixed(1)+'% margin':'','up','trending')}
    ${kpi('Platform Commission', inrK(commission), 'across sales channels','down','trending',true)}
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-head"><div><h3>Sales trend</h3><div class="ch-sub">Revenue by day</div></div></div>
      <div class="chart-wrap"><canvas id="cSales"></canvas></div></div>
    <div class="card"><div class="card-head"><div><h3>Sales by channel</h3><div class="ch-sub">Revenue share</div></div></div>
      <div class="chart-wrap"><canvas id="cChannel"></canvas></div></div>
  </div>
  <div class="grid-2b">

      </tbody></table></div></div>

  killCharts();

  const byDate={};

  const whs=[...new Set([...scopeInward().map(r=>r.wh),...out.map(o=>o.wh)])];
  const inMap={},outMap={}; whs.forEach(w=>{inMap[w]=0;outMap[w]=0;});
  scopeInward().forEach(r=>{ if(r.type==='Purchase') inMap[r.wh]=(inMap[r.wh]||0)+r.qty; });
  out.forEach(o=>outMap[o.wh]=(outMap[o.wh]||0)+o.qty);
  _charts.push(new Chart(document.getElementById('cMove'),{type:'bar',data:{labels:whs,datasets:[{label:'Inward',data:whs.map(w=>inMap[w]),backgroundColor:TEAL,borderRadius:5,barPercentage:.6},{label:'Outward',data:whs.map(w=>outMap[w]),backgroundColor:ORANGE,borderRadius:5,barPercentage:.6}]},options:barOpts()}));
};
function topSkus(out){
  const m={};
  out.forEach(o=>{const c=prod(o.sku).cost||0, comm=orderCommission(o); m[o.sku]=m[o.sku]||{sku:o.sku,qty:0,profit:0}; m[o.sku].qty+=o.qty; m[o.sku].profit+=o.qty*(o.price-c)-comm;});
  return Object.values(m).sort((a,b)=>b.profit-a.profit).slice(0,6);
}

/* --- CSV parsing (handles quoted fields & commas) --- */
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(field); field=''; } else if(c==='\n'||c==='\r'){ if(field!==''||row.length){ row.push(field); rows.push(row); row=[]; field=''; } if(c==='\r'&&text[i+1]==='\n') i++; } else field+=c; }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function readFileThen(input, cb){
  const file=input.files && input.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=e=>{ try{ cb(parseCSV(String(e.target.result))); }catch(err){ toast('Could not read file'); } input.value=''; };
  reader.onerror=()=>{ toast('Could not read file'); input.value=''; };
  reader.readAsText(file);
}
function handleInwardUpload(input){
  readFileThen(input, rows=>{
    if(rows.length<2){ showImportError('inward','The file has no data rows.',[]); return; }
    if(!BRANDS.length || !WAREHOUSES.length){
      showImportError('inward','You have not set up your workspace yet.',['Create at least one Brand (Administration → Brands).','Create at least one Warehouse (Administration → Warehouses).','Create a user and assign the brand to them.']);
      return;
    }
    // expected columns: Type, BOE, PO, Supplier, Brand, SKU, Product Name, Qty, Unit Cost, Value, Warehouse, Date, GRN
    // Validation matches on BRAND, USER (brand must be assigned to a user) and WAREHOUSE only.
    // SKU is NOT validated — unknown SKUs are auto-created under the matched brand.
    const errors=[]; const staged=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const ln=i+1;
      const [type,boe,po,supplier,brand,sku,pname,qtyS,costS,valS,wh,date,grn]=r.map(x=>String(x==null?'':x).trim());
      if(r.length<8 || (!sku && !boe && !po)){ continue; } // skip blank lines silently
      const rowErr=[];
      if(!boe) rowErr.push('missing BOE Declaration No.');
      if(!po) rowErr.push('missing PO Number');
      if(!sku) rowErr.push('missing SKU');
      else if(!PRODUCTS.some(p=>p.sku===sku)) rowErr.push(`SKU "${sku}" does not exist in the product master — add it under Products first`);
      if(!supplier) rowErr.push('missing Supplier');
      if(!brand) rowErr.push('missing Brand');
      else if(!BRANDS.includes(brand)) rowErr.push(`Brand "${brand}" does not exist`);
      else if(sku && PRODUCTS.some(p=>p.sku===sku) && prod(sku).brand!==brand) rowErr.push(`SKU "${sku}" belongs to brand "${prod(sku).brand}", not "${brand}"`);
      if(!wh) rowErr.push('missing Warehouse');
      else if(!WAREHOUSES.includes(wh)) rowErr.push(`Warehouse "${wh}" does not exist`);
      const qty=parseInt(qtyS)||0;
      if(!qty) rowErr.push('quantity must be a positive number');
      const t=/return/i.test(type)?'Return':(/purchase/i.test(type)||type===''?'Purchase':null);
      if(t===null) rowErr.push(`Type "${type}" must be Purchase or Return`);
      if(rowErr.length){ errors.push(`Row ${ln}: ${rowErr.join('; ')}`); continue; }
      staged.push({type:t,boe,po,supplier,brand,sku,pname,qty,costS,valS,wh,date:date||'2026-07-07',grn:grn||''});
    }
    if(errors.length){ showImportError('inward',`Import cancelled — ${errors.length} row(s) did not match your brands, users or warehouses. Nothing was imported.`, errors); return; }
    if(!staged.length){ showImportError('inward','No valid rows found in the file.',[]); return; }
    // UPDATED (Issue 6): validate first, then ask for confirmation before committing.
    // UPDATED (Point 1): when LIVE, persist to Supabase (grouped by BOE+PO) instead of memory-only.
    const commit=()=>{
      if(window.LIVE && typeof liveAddInwardBatch==='function'){
        // group staged rows by BOE+PO+supplier+date so each becomes one header with many lines
        const groups={};
        staged.forEach(s=>{
          const k=s.type+'|'+s.boe+'|'+s.po+'|'+s.supplier+'|'+s.date+'|'+(s.grn||'');
          (groups[k]=groups[k]||{header:{type:s.type,boe:s.boe,po:s.po,supplier:s.supplier,date:s.date,grn:s.grn},lines:[]});
          let unitCost=parseFloat(s.costS)||0; let val=parseFloat(s.valS)||0;
          if(!unitCost && val && s.qty) unitCost=val/s.qty;
          if(!val) val=unitCost*s.qty;
          groups[k].lines.push({sku:s.sku,qty:s.qty,value:Math.round(val),wh:s.wh,brand:s.brand});
        });
        (async()=>{
          try{
            for(const k of Object.keys(groups)){ await liveAddInwardBatch(groups[k].header, groups[k].lines); }
            clearImportError('inward'); touchUpdatedSafe();
            toast(`Imported ${staged.length} inward row(s)`); RENDER.inward();
          }catch(e){ showImportError('inward', e.message||'Upload failed while saving to the database. Nothing was committed after the failure.', []); }
        })();
        return;
      }
      // in-memory (demo) path
      staged.forEach(s=>{
        const p=ensureProduct(s.sku, s.pname, s.brand);
        let unitCost=parseFloat(s.costS)||0;
        let val=parseFloat(s.valS)||0;
        if(!unitCost && val && s.qty) unitCost=val/s.qty;
        if(!val) val=unitCost*s.qty;
        if(unitCost>0) p.cost=Math.round(unitCost);
        INWARD.unshift({id:nextId('IN'),type:s.type,boe:s.boe,po:s.po,supplier:s.supplier,brand:s.brand,sku:s.sku,qty:s.qty,value:Math.round(val),wh:s.wh,date:s.date,grn:s.grn});
      });
      recomputeStock();
      touchUpdated();
      clearImportError('inward');
      toast(`Imported ${staged.length} inward row(s)`);
      RENDER.inward();
    };
    confirmUpload('inward', staged.length, staged.slice(0,5).map(s=>`${s.type} · ${s.sku} · ${s.qty} → ${s.wh}`), commit);
  });
}

function handleOutwardUpload(input){
  readFileThen(input, rows=>{
    if(rows.length<2){ showImportError('outward','The file has no data rows.',[]); return; }
    if(!WAREHOUSES.length){
      showImportError('outward','You have not set up your workspace yet.',['Create at least one Warehouse.','Receive stock via Inward before recording sales.']);
      return;
    }
    // expected: Channel, Order ID, SKU, Product Name, Qty, Selling Price, Commission (AED), Date, Warehouse
    // Matches on WAREHOUSE (and the SKU's brand must belong to a user). SKU existence itself is not required,
    // but a sale still cannot exceed available stock. Commission is an AED amount per row.
    const errors=[]; const staged=[]; const running={};
    const stockOf=(sku,wh)=>{ const k=sku+'@'+wh; if(running[k]===undefined) running[k]=stockQty(sku,wh); return running[k]; };
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const ln=i+1;
      const [channel,order,sku,pname,qtyS,priceS,commS,date,wh]=r.map(x=>String(x==null?'':x).trim());
      if(r.length<5 || (!sku && !order)){ continue; }
      const rowErr=[];
      if(!sku) rowErr.push('missing SKU');
      const known=sku && PRODUCTS.some(p=>p.sku===sku);
      if(known && !brandHasUser(prod(sku).brand)) rowErr.push(`SKU "${sku}" belongs to brand "${prod(sku).brand}", which is not assigned to any user`);
      if(!wh) rowErr.push('missing Warehouse');
      else if(!WAREHOUSES.includes(wh)) rowErr.push(`Warehouse "${wh}" does not exist`);
      const qty=parseInt(qtyS)||0;
      if(!qty) rowErr.push('quantity must be a positive number');
      if(sku && wh && WAREHOUSES.includes(wh) && qty){
        if(stockOf(sku,wh)<qty) rowErr.push(`only ${stockOf(sku,wh)} of "${sku}" available in "${wh}" (need ${qty})`);
      }
      if(rowErr.length){ errors.push(`Row ${ln}: ${rowErr.join('; ')}`); continue; }
      const price=parseInt(priceS)|| (prod(sku).price||0);
      const commission=Math.round(parseFloat(commS)||0);
      running[sku+'@'+wh]-=qty;
      staged.push({order:order||nextRef('ORD'),channel:channel||'Offline',sku,qty,price,commission,date:date||'2026-07-07',wh,brand:prod(sku).brand||''});
    }
    if(errors.length){ showImportError('outward',`Import cancelled — ${errors.length} row(s) failed validation. Nothing was imported.`, errors); return; }
    if(!staged.length){ showImportError('outward','No valid rows found in the file.',[]); return; }
    // UPDATED (Issue 6): confirm before committing
    const commit=()=>{
      staged.forEach(s=>{ OUTWARD.unshift({...s, id:nextId('OU')}); });
      recomputeStock();      // FIXED (Issue 4)
      touchUpdated();        // ADDED (Issue 3)
      clearImportError('outward');
      toast(`Imported ${staged.length} sale(s)`);
      renderSalesTab();
    };
    confirmUpload('outward', staged.length, staged.slice(0,5).map(s=>`${s.channel} · ${s.sku} · ${s.qty} from ${s.wh}`), commit);
  });
}

// ADDED (Issue 5): bulk upload for stock transfers with row validation + confirmation
function handleTransferUpload(input){
  readFileThen(input, rows=>{
    if(rows.length<2){ showImportError('transfer','The file has no data rows.',[]); return; }
    if(WAREHOUSES.length<2){ showImportError('transfer','You need at least two warehouses.',[]); return; }
    const errors=[]; const staged=[]; const running={};
    const stockOf=(sku,wh)=>{ const k=sku+'@'+wh; if(running[k]===undefined) running[k]=stockQty(sku,wh); return running[k]; };
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const ln=i+1;
      const [sku,qtyS,from,to,date]=r.map(x=>String(x==null?'':x).trim());
      if(r.length<4 || (!sku && !from && !to)) continue;
      const rowErr=[];
      if(!sku) rowErr.push('missing SKU');
      else if(!PRODUCTS.some(p=>p.sku===sku)) rowErr.push(`SKU "${sku}" does not exist`);
      if(!from) rowErr.push('missing From Warehouse');
      else if(!WAREHOUSES.includes(from)) rowErr.push(`From Warehouse "${from}" does not exist`);
      if(!to) rowErr.push('missing To Warehouse');
      else if(!WAREHOUSES.includes(to)) rowErr.push(`To Warehouse "${to}" does not exist`);
      if(from && to && from===to) rowErr.push('From and To warehouses must differ');
      const qty=parseInt(qtyS)||0;
      if(!qty) rowErr.push('quantity must be a positive number');
      if(sku && from && WAREHOUSES.includes(from) && qty && stockOf(sku,from)<qty) rowErr.push(`only ${stockOf(sku,from)} of "${sku}" available in "${from}" (need ${qty})`);
      if(rowErr.length){ errors.push(`Row ${ln}: ${rowErr.join('; ')}`); continue; }
      running[sku+'@'+from]-=qty; running[sku+'@'+to]=(running[sku+'@'+to]===undefined?stockQty(sku,to):running[sku+'@'+to])+qty;
      staged.push({sku,qty,from,to,date:date||'2026-07-07'});
    }
    if(errors.length){ showImportError('transfer',`Import cancelled — ${errors.length} row(s) failed validation. Nothing was imported.`, errors); return; }
    if(!staged.length){ showImportError('transfer','No valid rows found in the file.',[]); return; }
    const commit=()=>{
      staged.forEach(s=>{ TRANSFERS.unshift({id:nextId('TRF'),sku:s.sku,qty:s.qty,from:s.from,to:s.to,date:s.date,status:'Delivered'}); });
      recomputeStock(); touchUpdated();
      clearImportError('transfer');
      toast(`Imported ${staged.length} transfer(s)`);
      renderTransferTab();
    };
    confirmUpload('transfer', staged.length, staged.slice(0,5).map(s=>`${s.sku} · ${s.qty} · ${s.from} → ${s.to}`), commit);
  });
}
function saveTransfer(){
  const sku=document.getElementById('tr_sku').value;
  const qty=parseInt(document.getElementById('tr_qty').value)||0;
  const from=document.getElementById('tr_from').value, to=document.getElementById('tr_to').value;
  const date=document.getElementById('tr_date').value||'2026-07-07';
  if(!qty){ toast('Enter a quantity'); return; }
  if(from===to){ toast('Choose different warehouses'); return; }
  if(stockQty(sku,from)<qty){ toast(`Not enough stock: ${stockQty(sku,from)} in ${from}`); return; }
  TRANSFERS.unshift({id:nextId('TRF'),sku,qty,from,to,date,status:'Delivered'});
  recomputeStock();        // FIXED (Issue 4): stock follows the ledger
  touchUpdated();          // ADDED (Issue 3)
  toast(`Transferred ${qty} ${sku}: ${from} → ${to}`);
  renderTransferTab();
}
// ADDED (Issue 5): delete a stock transfer and re-adjust stock
function deleteTransfer(id){
  const i=TRANSFERS.findIndex(t=>t.id===id); if(i<0) return;
  const t=TRANSFERS[i];
  TRANSFERS.splice(i,1);
  recomputeStock();        // reverses the from/to movement automatically
  touchUpdated();
  toast(`Deleted transfer ${esc(t.id)}`);
  renderTransferTab();
}
// ADDED (Issue 5): confirmation wrapper for transfer delete
function askDeleteTransfer(id){
  if(typeof confirmAction==='function'){ confirmAction('Are you sure you want to delete this transfer? Stock will be re-adjusted.', ()=>deleteTransfer(id)); }
  else if(confirm('Delete this transfer? Stock will be re-adjusted.')){ deleteTransfer(id); }
}

function exportFin(){

function reportRows(type){

  if(type==='sales') return {title:'Sales Summary',head:['Order','Channel','SKU','Qty','Price','Value','Warehouse','Date'],rows:scopeOutward().map(o=>[o.order,o.channel,o.sku,o.qty,o.price,o.qty*o.price,o.wh,o.date])};
  if(type==='inward') return {title:'Inward Register',head:['Type','BOE','PO','Supplier','SKU','Qty','Value','Warehouse','Date','GRN'],rows:scopeInward().map(r=>[r.type,r.boe,r.po,r.supplier,r.sku,r.qty,r.value,r.wh,r.date,r.grn])};
  if(type==='pnl'){ const out=scopeOutward(),m={}; out.forEach(o=>{const p=prod(o.sku),comm=orderCommission(o); m[o.sku]=m[o.sku]||{sku:o.sku,qty:0,rev:0,cogs:0,comm:0}; const r=m[o.sku]; r.qty+=o.qty; r.rev+=o.qty*o.price; r.cogs+=o.qty*(p.cost||0); r.comm+=comm;}); return {title:'P&L by SKU',head:['SKU','Units','Revenue','COGS','Commission','Net Profit'],rows:Object.values(m).map(r=>[r.sku,r.qty,r.rev,r.cogs,r.comm,r.rev-r.cogs-r.comm])}; }

function reportCSVFor(type){ const d=reportRows(type); if(!d.rows.length){ toast('No data for this report yet'); return; } downloadCSV(type+'_report.csv',[d.head,...d.rows]); }

    th.num,td.num{text-align:right}
    td{padding:7px 10px;border-bottom:1px solid #e3e9ea}
    tr:nth-child(even) td{background:#f7fafb}
    .foot{margin-top:20px;font-size:10px;color:#889;border-top:1px solid #e3e9ea;padding-top:10px;display:flex;justify-content:space-between}
    .badge{display:inline-block;background:#f68616;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  </style></head><body>
    <div class="head">
      <div><div class="brand">ENT<span>OEN</span></div><div class="doc-title">${d.title}</div></div>
      <div class="meta"><span class="badge">ENTOEN</span><br>Scope: ${esc(who)}<br>Warehouse: ${esc(wh)}<br>Generated: ${new Date().toLocaleString('en-GB')}</div>
    </div>
    <table><thead><tr>${d.head.map((h,i)=>`<th class="${numeric.has(i)||money.has(i)?'num':''}">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${d.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${numeric.has(i)||money.has(i)?'num':''}">${fmt(c,i)}</td>`).join('')}</tr>`).join('')}</tbody></table>

    <script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script>
  </body></html>`;
  win.document.write(html); win.document.close();
  toast('Opening print-ready PDF…');
}

function addBrand(){ const n=(document.getElementById('b_name').value||'').trim(); if(!n){toast('Enter a brand name');return;} if(BRANDS.includes(n)){toast('That brand exists');return;} BRANDS.push(n); toast('Brand created · '+n); RENDER.brands(); }
// UPDATED (Issue 2): cascade delete — remove the brand AND its linked products + their records
function removeBrand(b){
  const skus=new Set(PRODUCTS.filter(p=>p.brand===b).map(p=>p.sku));
  // remove products of this brand
  for(let i=PRODUCTS.length-1;i>=0;i--){ if(PRODUCTS[i].brand===b) PRODUCTS.splice(i,1); }
  // remove ledger rows referencing those SKUs (or matching the brand)
  for(let i=INWARD.length-1;i>=0;i--){ if(INWARD[i].brand===b || skus.has(INWARD[i].sku)) INWARD.splice(i,1); }
  for(let i=OUTWARD.length-1;i>=0;i--){ if(skus.has(OUTWARD[i].sku)) OUTWARD.splice(i,1); }
  for(let i=TRANSFERS.length-1;i>=0;i--){ if(skus.has(TRANSFERS[i].sku)) TRANSFERS.splice(i,1); }
  // unlink from users
  USERS.forEach(u=>{ if(u.brands) u.brands=u.brands.filter(x=>x!==b); });
  const idx=BRANDS.indexOf(b); if(idx>=0) BRANDS.splice(idx,1);
  recomputeStock();        // FIXED (Issue 4): clears any stock tied to removed SKUs
  touchUpdated();          // ADDED (Issue 3)
  toast('Brand and its products removed');
  RENDER.brands();
}

/* ---------- generic MODAL ---------- */
function openModal(title, bodyHtml, onSave, saveLabel){
  closeModal();
  const wrap=document.createElement('div');
  wrap.className='modal-scrim'; wrap.id='appModal';
  wrap.innerHTML=`<div class="modal-card">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" data-onclick="closeModal()">✕</button></div>
    <div id="modalErr" class="field-error" style="display:none"></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-onclick="closeModal()">Cancel</button>
      <button class="btn btn-teal" id="modalSave">${esc(saveLabel||'Save')}</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  window._modalSave=onSave;
  const btn=document.getElementById('modalSave');
  btn.setAttribute('data-onclick','_runModalSave()');
}
function _runModalSave(){ if(typeof window._modalSave==='function') window._modalSave(); }
function closeModal(){ const m=document.getElementById('appModal'); if(m) m.remove(); window._modalSave=null; }

/* ---------- generic CONFIRM (Feature 3) ---------- */
function confirmAction(message, onYes){
  closeModal();
  const wrap=document.createElement('div');
  wrap.className='modal-scrim'; wrap.id='appModal';
  wrap.innerHTML=`<div class="modal-card modal-sm">
    <div class="modal-head"><h3>Please confirm</h3><button class="modal-x" data-onclick="closeModal()">✕</button></div>
    <div class="modal-body"><p style="font-size:14px;line-height:1.5">${esc(message)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-onclick="closeModal()">Cancel</button>
      <button class="btn btn-del-solid" id="modalConfirm">Yes, delete</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  window._confirmYes=onYes;
  document.getElementById('modalConfirm').setAttribute('data-onclick','_runConfirm()');
}
function _runConfirm(){ const fn=window._confirmYes; closeModal(); if(typeof fn==='function') fn(); }

function editBrand(oldName){
  openModal('Edit brand',
    `<div class="fg-field"><label>Brand name <span class="req">*</span></label><input id="edit_brand" value="${esc(oldName)}"></div>`,
    ()=>{
      const v=(document.getElementById('edit_brand').value||'').trim();
      if(!v){ showFieldError('modalErr','Brand name is required'); return; }
      if(v!==oldName && BRANDS.includes(v)){ showFieldError('modalErr','That brand already exists'); return; }
      updateBrand(oldName, v);
      closeModal(); toast('Brand updated'); RENDER.brands();
    }, 'Save changes');

function updateBrand(oldName, newName){
  const i=BRANDS.indexOf(oldName); if(i<0) return;
  BRANDS[i]=newName;
  // keep related records consistent
  PRODUCTS.forEach(p=>{ if(p.brand===oldName) p.brand=newName; });
  INWARD.forEach(r=>{ if(r.brand===oldName) r.brand=newName; });
  USERS.forEach(u=>{ if(u.brands) u.brands=u.brands.map(b=>b===oldName?newName:b); });
  if(window.LIVE && typeof liveUpdateBrand==='function'){ liveUpdateBrand(oldName,newName); }
}

// ADDED: shows a preview + "Are you sure you want to proceed with this upload?"
function confirmUpload(kind, count, previewLines, onConfirm){

    ? '<div class="upload-preview"><div class="up-title">Preview (first '+previewLines.length+'):</div>'
      + previewLines.map(function(l){return '<div class="up-row">'+esc(l)+'</div>';}).join('')
      + (count>previewLines.length?'<div class="up-more">…and '+(count-previewLines.length)+' more row(s)</div>':'')
      + '</div>'
    : '';
  var body = '<p style="font-size:14px;line-height:1.5;margin-bottom:6px">'
    + label+' upload validated: <b>'+count+'</b> row(s) ready.<br>Are you sure you want to proceed with this upload?</p>'
    + preview;
  if(typeof openModal==='function'){
    openModal('Confirm '+label+' upload', body, function(){
      closeModal();
      if(typeof onConfirm==='function') onConfirm();
    }, 'Confirm & process');
  } else {
    if(confirm('Are you sure you want to proceed with this upload? ('+count+' rows)')) onConfirm();
  }
}

// ADDED: delete a product (+ its ledger rows), with confirmation
function askDeleteProduct(sku){
  var msg='Delete product "'+sku+'" and all its inward/outward/transfer records? This cannot be undone.';
  if(typeof confirmAction==='function') confirmAction(msg, function(){ deleteProduct(sku); });
  else if(confirm(msg)) deleteProduct(sku);
}
function deleteProduct(sku){
  for(var i=PRODUCTS.length-1;i>=0;i--){ if(PRODUCTS[i].sku===sku) PRODUCTS.splice(i,1); }
  for(var a=INWARD.length-1;a>=0;a--){ if(INWARD[a].sku===sku) INWARD.splice(a,1); }
  for(var b=OUTWARD.length-1;b>=0;b--){ if(OUTWARD[b].sku===sku) OUTWARD.splice(b,1); }
  for(var c=TRANSFERS.length-1;c>=0;c--){ if(TRANSFERS[c].sku===sku) TRANSFERS.splice(c,1); }
  recomputeStock(); touchUpdated();
  if(window.LIVE && typeof liveDeleteProduct==='function'){ liveDeleteProduct(sku); }
  toast('Product deleted · '+sku);
  closeModal();
  if(typeof RENDER!=='undefined' && RENDER.brands) RENDER.brands();
}

// Bulk product upload with per-row error mapping; catalog only (no stock)
function handleProductUpload(input){
  readFileThen(input, rows=>{
    if(rows.length<2){ showImportError('product','The file has no data rows.',[]); return; }
    if(!BRANDS.length){ showImportError('product','Create at least one brand first.',[]); return; }
    const errors=[]; const staged=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const ln=i+1;
      const [sku,name,brand,category,costS,priceS,reorderS,maxS]=r.map(x=>String(x==null?'':x).trim());
      if(r.length<3 || (!sku && !name)) continue;
      const e=[];
      if(!sku) e.push('missing SKU');
      else if(PRODUCTS.some(p=>p.sku.toLowerCase()===sku.toLowerCase()) || staged.some(s=>s.sku.toLowerCase()===sku.toLowerCase())) e.push(`SKU "${sku}" already exists`);
      if(!name) e.push('missing Product Name');
      if(!brand) e.push('missing Brand');
      else if(!BRANDS.includes(brand)) e.push(`Brand "${brand}" does not exist`);
      if(e.length){ errors.push(`Row ${ln}: ${e.join('; ')}`); continue; }
      staged.push({ sku, name, brand, category:category||'', cost:parseInt(costS)||0, price:parseInt(priceS)||0, reorder:parseInt(reorderS)||0, max:parseInt(maxS)||0 });
    }
    if(errors.length){ showImportError('product',`Import cancelled — ${errors.length} row(s) failed. Nothing was imported.`, errors); return; }
    if(!staged.length){ showImportError('product','No valid rows found.',[]); return; }
    const commit=()=>{
      const run=async()=>{
        for(const s of staged){
          if(window.LIVE && typeof liveAddProduct==='function'){ await liveAddProduct(s); }
          else PRODUCTS.push(s);
        }
        touchUpdatedSafe(); clearImportError('product');
        toast(`Imported ${staged.length} product(s)`); RENDER.products();
      };
      run().catch(e=>showImportError('product', e.message||'Upload failed', []));
    };
    if(typeof confirmUpload==='function') confirmUpload('product', staged.length, staged.slice(0,5).map(s=>`${s.sku} · ${s.name} · ${s.brand}`), commit);
    else commit();
  });
}

let EDIT_LINES=[]; let _elSeq=0; let EDIT_CTX=null;

    <div class="table-scroll"><table class="line-table"><thead><tr><th style="min-width:200px">SKU</th><th class="num" style="min-width:90px">Qty</th><th class="num" style="min-width:120px">Value</th><th style="min-width:130px">Warehouse</th><th style="width:40px"></th></tr></thead><tbody id="ei_lines"></tbody></table></div>
    <button class="btn btn-ghost" style="margin-top:8px" data-onclick="addEditLine()">+ Add Product</button>`;

  renderEditLines();

function addEditLine(){ EDIT_LINES.push({lid:'E'+(++_elSeq),sku:(PRODUCTS[0]||{}).sku||'',qty:'',value:'',wh:WAREHOUSES[0]||''}); renderEditLines(); }
function removeEditLine(lid){ EDIT_LINES=EDIT_LINES.filter(l=>l.lid!==lid); renderEditLines(); }
function syncEditLine(lid,field,val){ const l=EDIT_LINES.find(x=>x.lid===lid); if(l) l[field]=val; }
function renderEditLines(){
  const body=document.getElementById('ei_lines'); if(!body) return;
  const opts=window.__eiOpts||'';
  body.innerHTML=EDIT_LINES.map(l=>`<tr>
    <td><select data-onchange="syncEditLine('${l.lid}','sku',this.value)">${opts.replace(`value="${esc(l.sku)}"`,`value="${esc(l.sku)}" selected`)}</select></td>
    <td class="num"><input type="number" min="1" value="${esc(String(l.qty))}" data-oninput="syncEditLine('${l.lid}','qty',this.value)"></td>
    <td class="num"><input type="number" value="${esc(String(l.value))}" data-oninput="syncEditLine('${l.lid}','value',this.value)"></td>
    <td><select data-onchange="syncEditLine('${l.lid}','wh',this.value)">${WAREHOUSES.map(w=>`<option${w===l.wh?' selected':''}>${esc(w)}</option>`).join('')}</select></td>
    <td class="num"><button class="btn btn-ghost btn-del" style="padding:4px 8px" data-onclick="removeEditLine('${l.lid}')">✕</button></td>
  </tr>`).join('');

function saveInwardEdit(){
  const type=document.getElementById('ei_type').value;
  const boe=(document.getElementById('ei_boe').value||'').trim();
  const po=(document.getElementById('ei_po').value||'').trim();
  const supplier=(document.getElementById('ei_supplier').value||'').trim();
  const date=document.getElementById('ei_date').value||'';
  const grn=(document.getElementById('ei_grn').value||'').trim();
  if(!boe||!po){ showFieldError('modalErr','BOE and PO are required'); return; }
  const valid=[]; const seen={};
  for(const l of EDIT_LINES){
    const q=parseInt(l.qty)||0; if(!l.sku||!q||!l.wh) continue;
    const k=l.sku+'@'+l.wh; if(seen[k]){ showFieldError('modalErr',`Duplicate line: ${l.sku} in ${l.wh}`); return; } seen[k]=true;
    const p=prod(l.sku);
    valid.push({sku:l.sku,qty:q,value:parseInt(l.value)||q*((p&&p.cost)||0),wh:l.wh,brand:(p&&p.brand)||''});
  }
  if(!valid.length){ showFieldError('modalErr','Add at least one product line'); return; }
  // CRITICAL LOGIC (Priority 3): remove all old group rows, insert new ones, then recompute stock.
  // Because stock is recomputed from the ledger, the previous impact is reversed automatically —
  // no duplicate stock addition, no mismatch.
  if(window.LIVE && typeof liveEditInwardGroup==='function'){
    liveEditInwardGroup(EDIT_CTX.ids, {type,boe,po,supplier,date,grn}, valid)
      .then(()=>{ closeModal(); toast('Intake updated'); RENDER.inward(); })
      .catch(e=>{ showFieldError('modalErr', e.message||'Could not update'); });
    return;
  }
  const idset=new Set(EDIT_CTX.ids);
  for(let i=INWARD.length-1;i>=0;i--){ if(idset.has(INWARD[i].id)) INWARD.splice(i,1); }
  valid.forEach(v=>{ INWARD.unshift({id:nextId('IN'),type,boe,po,supplier,brand:v.brand,sku:v.sku,qty:v.qty,value:v.value,wh:v.wh,date,grn}); });
  recomputeStock(); touchUpdatedSafe();
  closeModal(); toast('Intake updated'); RENDER.inward();
}

/* ============================================================
   REUSABLE FILTER + EXPORT TOOLBAR  (Point 5)
   A single component used across list pages. It filters the
   rendered table rows client-side and exports the visible rows.
============================================================ */
// registry: key -> { columns:[{label,key}], getRows:fn, filters:[{label,key,options?}] , filename }
const LIST_REG = {};
const LIST_STATE = {}; // key -> { search:'', filterVals:{} }

function registerList(key, cfg){ LIST_REG[key]=cfg; if(!LIST_STATE[key]) LIST_STATE[key]={search:'',filterVals:{}}; }

function listToolbar(key){
  const cfg=LIST_REG[key]; if(!cfg) return '';
  const st=LIST_STATE[key]||{search:'',filterVals:{}};
  const filters=(cfg.filters||[]).map(f=>{
    const opts=(typeof f.options==='function'?f.options():f.options)||[];
    const cur=st.filterVals[f.key]||'';
    const req=f.required?'<span class="req">*</span>':'';
    return `<div class="lf-field"><label>${esc(f.label)} ${req}</label>
      <select data-onchange="listSetFilter('${key}','${f.key}',this.value)">
        <option value="">${f.required?'Select…':'All'}</option>
        ${opts.map(o=>`<option value="${esc(o)}"${o===cur?' selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }).join('');
  return `<div class="list-toolbar">
    <div class="lf-search"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Search…" value="${esc(st.search||'')}" data-oninput="listSetSearch('${key}',this.value)"></div>
    ${filters}
    <div class="spacer"></div>
    <button class="btn btn-ghost" data-onclick="listExport('${key}')">Export CSV</button>
  </div>`;
}
function listSetSearch(key,val){ LIST_STATE[key].search=val; if(LIST_REG[key]&&LIST_REG[key].rerender) LIST_REG[key].rerender(); }
function listSetFilter(key,fkey,val){ LIST_STATE[key].filterVals[fkey]=val; if(LIST_REG[key]&&LIST_REG[key].rerender) LIST_REG[key].rerender(); }
function listApply(key, rows){
  const cfg=LIST_REG[key], st=LIST_STATE[key]; if(!cfg||!st) return rows;
  let out=rows.slice();
  // dropdown filters
  (cfg.filters||[]).forEach(f=>{
    const v=st.filterVals[f.key];
    if(v){ out=out.filter(r=> String(f.value?f.value(r):r[f.key]||'')===v ); }
  });
  // text search across all declared columns
  const q=(st.search||'').trim().toLowerCase();
  if(q){ out=out.filter(r=> cfg.columns.some(c=>{ const val=c.get?c.get(r):r[c.key]; return String(val==null?'':val).toLowerCase().includes(q); })); }
  return out;
}
function listExport(key){
  const cfg=LIST_REG[key]; if(!cfg){ toast('Nothing to export'); return; }
  const rows=listApply(key, cfg.getRows());
  const header=cfg.columns.map(c=>c.label);
  const body=rows.map(r=>cfg.columns.map(c=>{ const v=c.get?c.get(r):r[c.key]; return v==null?'':v; }));
  downloadCSV((cfg.filename||key)+'_export.csv',[header,...body]);
}
// convenience: does this page's required filters all have a value?
function listRequiredMet(key){
  const cfg=LIST_REG[key], st=LIST_STATE[key]; if(!cfg) return true;
  return (cfg.filters||[]).filter(f=>f.required).every(f=>st.filterVals[f.key]);
}

/* ============================================================
   POINT 5 — GLOBAL FILTER + EXPORT on list pages
   Wrap the remaining list renderers to inject a toolbar that
   filters the visible table and exports filtered rows.
   We keep each page's existing markup and just enhance it.
============================================================ */
function _enhanceListPage(renderName, buildCfg){
  const orig = RENDER[renderName];
  if(typeof orig!=='function') return;
  RENDER[renderName] = function(){
    orig();                       // render existing page unchanged
    const cfg = buildCfg();
    if(!cfg) return;
    registerList(cfg.key, Object.assign({ rerender:()=>RENDER[renderName]() }, cfg));
    _injectToolbarAndFilter(cfg);
  };
}
// DOM-based: injects toolbar and filters rows by their visible text — no render-function changes needed.
function _injectToolbarAndFilter(cfg){
  const tables = C.querySelectorAll('table');
  if(!tables.length) return;
  const table = cfg.tableIndex!=null ? tables[cfg.tableIndex] : tables[tables.length-1];
  if(!table) return;
  if(!table.closest('.card') && !table.parentNode) return;
  // inject toolbar once
  const scroll = table.closest('.table-scroll') || table;
  if(scroll.parentNode && !scroll.parentNode.querySelector('.list-toolbar')){
    const wrap=document.createElement('div'); wrap.innerHTML=listToolbar(cfg.key);
    scroll.parentNode.insertBefore(wrap.firstElementChild, scroll);
  }
  // map header labels -> column index for dropdown filters
  const heads=[...table.querySelectorAll('thead th')].map(th=>(th.textContent||'').trim().toLowerCase());
  const st=LIST_STATE[cfg.key]||{search:'',filterVals:{}};
  const q=(st.search||'').trim().toLowerCase();
  const trs=table.querySelectorAll('tbody tr');
  trs.forEach(tr=>{
    const cells=[...tr.children].map(td=>(td.textContent||'').trim());
    const rowText=cells.join(' ').toLowerCase();
    let show=true;
    // text search
    if(q && !rowText.includes(q)) show=false;
    // dropdown filters (match by column header name)
    if(show){ (cfg.filters||[]).forEach(f=>{
      const v=st.filterVals[f.key]; if(!v) return;
      const ci=heads.indexOf((f.matchColumn||f.label).toLowerCase());
      if(ci>=0){ if(String(cells[ci]||'').toLowerCase()!==String(v).toLowerCase()) show=false; }
    }); }
    tr.style.display = show ? '' : 'none';
  });
}

(function(){

/* ---------- LOGIN via Supabase ---------- */
async function liveLogin(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  const { data:{ user } } = await sb.auth.getUser();
  const { data: profile } = await sb.from('profiles').select('*, user_brands(brand_id)').eq('id', user.id).single();
  if (!profile) throw new Error('No profile found for this account.');
  if (!profile.active) { await sb.auth.signOut(); throw new Error('This account is deactivated.'); }
  CURRENT = {
    id: profile.id, name: profile.name, email: profile.email,
    role: profile.role==='admin' ? 'admin' : 'brand',
    brands: [], active: profile.active, mustReset: profile.must_reset_password
  };
  ROLE = CURRENT.role;
  // load brand map first so we can resolve this user's brand names
  const { data: brands } = await sb.from('brands').select('*');
  BRAND_NAME={}; (brands||[]).forEach(b=>BRAND_NAME[b.id]=b.name);
  CURRENT.brands = (profile.user_brands||[]).map(x=>BRAND_NAME[x.brand_id]).filter(Boolean);
  return CURRENT;
}
